models:
  - name: stg_shop__customers
    description: Cleaned customer master used by migrated legacy workflows.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_shop__orders
    description: Cleaned order headers with normalized status and currency values.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['CANCELLED', 'COMPLETED', 'PENDING', 'RETURNED', 'SHIPPED']
      - name: currency_code
        data_tests:
          - accepted_values:
              arguments:
                values: ['CAD', 'EUR', 'USD']

  - name: stg_shop__order_lines
    description: Order lines with local-currency prices and discounts unchanged from source.
    columns:
      - name: order_line_id
        data_tests:
          - unique
          - not_null

  - name: stg_shop__returns
    description: Return events with refund amounts in the original order currency.
    columns:
      - name: return_id
        data_tests:
          - unique
          - not_null

  - name: stg_shop__fx_rates
    description: Monthly currency conversion rates to USD; USD intentionally has no source rows.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['currency_code', 'rate_month']
    columns:
      - name: currency_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CAD', 'EUR']
      - name: rate_month
        data_tests:
          - not_null
