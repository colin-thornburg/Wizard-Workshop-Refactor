models:
  - name: stg_shop__customers
    description: Cleaned customer master at one row per customer.
    columns:
      - name: customer_id
        description: Customer identifier.
        data_tests: [unique, not_null]
      - name: is_test_account
        description: Whether the customer is a QA or test account.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: stg_shop__products
    description: Cleaned product catalog at one row per product.
    columns:
      - name: product_id
        description: Product identifier.
        data_tests: [unique, not_null]

  - name: stg_shop__orders
    description: Cleaned order headers at one row per order.
    columns:
      - name: order_id
        description: Order identifier.
        data_tests: [unique, not_null]
      - name: order_status
        description: Normalized order status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CANCELLED', 'COMPLETED', 'PENDING', 'RETURNED', 'SHIPPED']
      - name: currency_code
        description: Normalized ISO currency code.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CAD', 'EUR', 'USD']

  - name: stg_shop__order_lines
    description: Order line items at one row per order line.
    columns:
      - name: order_line_id
        description: Order line identifier.
        data_tests: [unique, not_null]

  - name: stg_shop__returns
    description: Cleaned returns at one row per return.
    columns:
      - name: return_id
        description: Return identifier.
        data_tests: [unique, not_null]

  - name: stg_shop__fx_rates
    description: Monthly currency conversion rates to USD.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['currency_code', 'rate_month']
    columns:
      - name: currency_code
        description: Normalized ISO currency code.
        data_tests: [not_null]
      - name: rate_month
        description: Month the rate applies to.
        data_tests: [not_null]
