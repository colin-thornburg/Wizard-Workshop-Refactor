models:
  - name: int_orders__enriched
    description: Order headers enriched with the shared valid-order and test-customer flags.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

  - name: int_order_lines__usd
    description: >
      All order lines with product attributes, local and per-line rounded USD amounts, USD COGS,
      and reusable quality flags; no business filters are applied.
    columns:
      - name: order_line_id
        data_tests:
          - unique
          - not_null

  - name: int_returns__usd
    description: All return rows converted with the associated order-month FX rate plus reusable quality flags; no business filters are applied.
    columns:
      - name: return_id
        data_tests:
          - unique
          - not_null
