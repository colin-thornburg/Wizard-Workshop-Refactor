models:
  - name: int_customer_ltv__rollup
    description: >
      Customer-grain rollup reproducing the stored procedure's eligible-customer filter, valid-order
      scope, per-line USD rounding, and order-month refund conversion. Missing FX rates intentionally
      default to 1, and returns intentionally have no return-date cutoff for legacy parity.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: int_order_lines__usd
    description: >
      Shared order-line money model for migrated marts. Preserves the Informatica lookup behavior:
      missing FX defaults to 1, deleted products use category UNKNOWN and zero unit cost, and gross,
      discount, and net amounts are rounded to USD independently at line grain before aggregation.
    columns:
      - name: order_line_id
        data_tests:
          - unique
          - not_null
