models:
  - name: fct_daily_sales
    description: >
      Daily sales summary by reporting channel group and product category, migrated from Informatica.
      Preserves legacy behavior: only completed, shipped, and returned orders are included; test customers
      and non-positive quantities are excluded; unknown channels map to OTHER; unknown products map to
      UNKNOWN with zero COGS; and every USD amount is rounded per line before aggregation.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['sales_date', 'channel_group', 'product_category']
      - legacy_parity:
          arguments:
            legacy_relation: ref('legacy_daily_sales_summary')
    columns:
      - name: sales_date
        description: Qualifying order date.
        data_tests:
          - not_null
      - name: channel_group
        description: Reporting channel group derived from the normalized order channel.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ONLINE', 'RETAIL', 'MARKETPLACE', 'OTHER']
      - name: product_category
        description: Product category from the catalog, defaulting unmatched products to UNKNOWN.
        data_tests:
          - not_null
      - name: order_line_count
        description: Number of included order lines.
      - name: units_sold
        description: Sum of positive quantities on included order lines.
      - name: gross_sales_usd
        description: Sum of per-line rounded gross sales converted at the order-month FX rate.
      - name: discount_usd
        description: Sum of per-line rounded discounts converted at the order-month FX rate.
      - name: net_sales_usd
        description: Sum of per-line rounded net sales converted at the order-month FX rate.
      - name: cogs_usd
        description: Sum of quantity multiplied by product unit cost in USD; unmatched products contribute zero.
      - name: gross_margin_usd
        description: Net sales in USD less COGS in USD.
      - name: gross_margin_pct
        description: Gross margin divided by net sales, rounded to four decimals; zero when net sales is zero.


  - name: fct_product_returns
    description: >
      Product-level sales and returns summary migrated from Talend. Preserves legacy behavior: only valid-order,
      non-test-customer lines for known products are included; returned units are capped at sold quantity per line;
      refund dollars and reason ranking remain uncapped; ties for top reason break alphabetically; and missing
      return reasons display as NONE.
    data_tests:
      - legacy_parity:
          arguments:
            legacy_relation: ref('legacy_product_returns_summary')
    columns:
      - name: product_id
        description: Unique identifier for a known product with qualifying sales.
        data_tests:
          - unique
          - not_null
      - name: sku
        description: Product stock-keeping unit from the product catalog.
      - name: product_name
        description: Product name from the product catalog.
      - name: category
        description: Product category from the product catalog.
      - name: units_sold
        description: Sum of quantities across qualifying sales lines, including zero or negative adjustments.
      - name: units_returned
        description: Returned quantity capped at the sold quantity independently for each order line.
      - name: return_rate
        description: Capped units returned divided by units sold, rounded to four decimals; zero when units sold is non-positive.
      - name: refund_amount_usd
        description: Uncapped sum of per-return refunds converted at the associated order-month FX rate.
      - name: top_return_reason
        description: Display label for the reason with the most uncapped returned units; alphabetical code breaks ties.
      - name: return_flag
        description: HIGH at 15 percent with at least 10 units sold, WATCH at 8 percent, otherwise NORMAL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['HIGH', 'WATCH', 'NORMAL']
