models:
  - name: fct_daily_sales
    description: >
      Daily sales summary migrated from Informatica at one row per sales date, reporting channel group, and
      product category. Preserves per-line USD rounding, treats missing FX as rate 1, maps missing products to
      UNKNOWN with zero COGS, excludes test customers and non-positive quantities, and calculates margin after
      aggregation.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['sales_date', 'channel_group', 'product_category']
      - legacy_parity:
          arguments:
            legacy_relation: ref('legacy_daily_sales_summary')
    columns:
      - name: sales_date
        description: Order date for the included sales lines.
        data_tests:
          - not_null
      - name: channel_group
        description: Reporting channel grouping; WEB and APP are ONLINE, STORE is RETAIL, and unrecognized channels are OTHER.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ONLINE', 'RETAIL', 'MARKETPLACE', 'OTHER']
      - name: product_category
        description: Source product category, defaulting deleted or unmatched products to UNKNOWN.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Accessories', 'Apparel', 'Camping', 'Climbing', 'Footwear', 'Water Sports', 'UNKNOWN']
      - name: order_line_count
        description: Count of included positive-quantity order lines.
      - name: units_sold
        description: Sum of quantity across included order lines.
      - name: gross_sales_usd
        description: Sum of per-line rounded gross sales converted using the order-month FX rate.
      - name: discount_usd
        description: Sum of per-line rounded discounts converted using the order-month FX rate.
      - name: net_sales_usd
        description: Sum of per-line rounded net sales converted using the order-month FX rate.
      - name: cogs_usd
        description: Sum of quantity multiplied by product unit cost, which is already denominated in USD.
      - name: gross_margin_usd
        description: Net sales in USD less COGS in USD.
      - name: gross_margin_pct
        description: Gross margin divided by net sales, rounded to four decimals; zero when net sales is zero.

  - name: fct_product_returns
    description: >
      Product-level sales and returns summary migrated from Talend. Includes products with valid non-test sales
      lines, drops deleted products, caps returned units at sold units per order line, leaves refund dollars
      uncapped, and ranks top reasons using raw returned units with an alphabetical reason-code tie-break.
    data_tests:
      - legacy_parity:
          arguments:
            legacy_relation: ref('legacy_product_returns_summary')
    columns:
      - name: product_id
        description: Unique identifier for the known product.
        data_tests:
          - unique
          - not_null
      - name: sku
        description: Product stock-keeping unit from the product lookup.
      - name: product_name
        description: Product name from the product lookup.
      - name: category
        description: Product category from the product lookup.
      - name: units_sold
        description: Total units across valid non-test order lines; zero and negative quantities are retained.
      - name: units_returned
        description: Returned units capped at the sold quantity separately for each order line, then summed.
      - name: return_rate
        description: Capped returned units divided by units sold, rounded to four decimals; zero when units sold is not positive.
      - name: refund_amount_usd
        description: Sum of uncapped per-return refunds converted at the order-month FX rate and rounded to two decimals.
      - name: top_return_reason
        description: Human-readable reason with the most raw returned units; alphabetical reason code breaks ties, and no returns becomes NONE.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NONE', 'Damaged', 'Wrong Size', 'Not As Described', 'Changed Mind', 'Other']
      - name: return_flag
        description: HIGH for at least 10 units sold and return rate at least 15%; WATCH for at least 8%; otherwise NORMAL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['HIGH', 'WATCH', 'NORMAL']
