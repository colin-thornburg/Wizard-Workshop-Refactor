name: wizard_workshop
version: "1.0.0"
config-version: 2
profile: wizard_workshop

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Legacy LTV snapshot was produced with this as-of date. Never use current_date in migrated models.
  as_of_date: "2026-09-30"

seeds:
  wizard_workshop:
    raw:
      +schema: raw
    legacy_targets:
      +schema: legacy

models:
  wizard_workshop:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
